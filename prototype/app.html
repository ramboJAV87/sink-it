<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Green Read</title>
<style>
  :root { --paper:#0B1410; --paper-deep:#182620; --ink:#FFFFFF; --ink-soft:rgba(255,255,255,.6); --flag:#FF5A5F; --gold:#FFD166; --lime:#B8F53D; --cyan:#4CE0D2; --pink:#FF7EB6; --ball:#FFFFFF; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:ui-rounded,"SF Pro Rounded","Nunito","Varela Round","Segoe UI",system-ui,-apple-system,sans-serif;overscroll-behavior:none}
  body{display:flex;flex-direction:column;align-items:center;touch-action:manipulation}
  .app{width:100%;max-width:480px;display:flex;flex-direction:column;min-height:100%;padding:14px 14px 10px}
  .screen{display:none;flex-direction:column;flex:1}.screen.on{display:flex}
  /* home */
  .hero{margin-top:12vh;text-align:center}
  .wordmark{font-size:52px;font-weight:900;letter-spacing:-0.04em;line-height:1;background:linear-gradient(90deg,var(--lime),var(--cyan));-webkit-background-clip:text;background-clip:text;color:transparent}
  .wordmark em{font-style:normal}
  .tag{color:var(--ink-soft);margin-top:8px;font-size:15px}
  .menu{margin-top:36px;display:flex;flex-direction:column;gap:12px}
  .menu button{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:20px 22px;border-radius:24px}
  .menu button small{display:block;font-weight:500;font-size:13px;opacity:.75;margin-top:3px}
  .menu button .n{font-size:22px;font-weight:800;opacity:.9}
  /* play */
  header{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
  .green-name{font-size:24px;font-weight:900;letter-spacing:-0.02em;line-height:1.1}
  .green-name small{display:block;font-size:13px;font-weight:500;color:var(--ink-soft);margin-top:2px}
  .target{text-align:right;font-size:13px;color:var(--ink-soft);line-height:1.2}
  .target b{display:block;font-size:30px;font-weight:900;color:var(--lime);letter-spacing:-0.02em}
  .status{display:flex;justify-content:space-between;align-items:center;margin:10px 0 8px;font-size:14px}
  .balls{display:flex;gap:6px}.balls i{width:14px;height:14px;border-radius:50%;background:var(--ball);border:2px solid var(--ball);display:inline-block;box-shadow:0 0 10px rgba(255,255,255,.6)}
  .balls i.used{background:transparent;border-color:var(--ink-soft);opacity:.5;box-shadow:none}
  .best{color:var(--ink-soft);display:flex;align-items:center;gap:8px}.best b{color:var(--gold);font-weight:900;font-size:17px}.stars{font-size:18px;letter-spacing:1px;color:var(--gold)}.stars .off{color:rgba(255,255,255,.18)}
  .goals{display:flex;gap:6px;margin:0 0 10px}.goals span{flex:1;text-align:center;padding:7px 4px;border-radius:12px;background:var(--paper-deep);font-weight:800;font-size:13px;color:rgba(255,255,255,.8)}.goals span b{color:var(--gold);font-size:12px;display:block;letter-spacing:1px}.goals span.hit{background:rgba(255,209,102,.18);color:#fff}
  .stage{position:relative;width:100%}
  canvas{display:block;width:100%;border-radius:28px;box-shadow:0 0 0 1px rgba(242,235,221,.08),0 30px 60px -30px rgba(0,0,0,.9)}
  .loading{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;border-radius:28px;background:rgba(11,20,16,.92);color:var(--lime);font-weight:900;font-size:20px}
  .msg{min-height:64px;margin-top:12px;font-size:16px;line-height:1.35;color:rgba(255,255,255,.85)}
  .msg .result{display:inline-block;font-size:20px;font-weight:900;letter-spacing:-0.01em;padding:6px 14px;border-radius:999px;background:linear-gradient(90deg,var(--pink),var(--gold));color:#0B1410;margin-bottom:6px}.msg .result span{font-weight:800;opacity:.75}
  .actions{display:flex;gap:10px;margin-top:8px}
  button{appearance:none;border:0;border-radius:999px;padding:15px 20px;font:inherit;font-weight:900;font-size:17px;background:linear-gradient(90deg,var(--lime),var(--cyan));color:#0B1410;cursor:pointer;flex:1;box-shadow:0 8px 24px -8px rgba(184,245,61,.6)}
  button.quiet{background:var(--paper-deep);color:var(--ink);box-shadow:none}
  button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
  .hidden{display:none!important}
  .foot{margin-top:auto;padding-top:10px;font-size:13px;font-weight:800;display:flex;justify-content:space-between;gap:8px}.foot span{padding:6px 12px;border-radius:999px;background:var(--paper-deep);color:var(--cyan)}.foot span:last-child{color:var(--pink)}
  .share{margin-top:12px;background:var(--paper-deep);border-radius:20px;padding:14px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px}.share .t{font-weight:900;font-size:17px}.share .s{font-size:13px;color:var(--ink-soft);font-weight:700;margin-top:2px}.share .e{font-size:30px;letter-spacing:2px;line-height:1}
.target b{font-size:30px}#create .target b{font-size:22px}
  .tools{display:flex;gap:6px;margin:8px 0}.tools button{flex:1;padding:10px 4px;font-size:13px;border-radius:12px;background:var(--paper-deep);color:var(--ink);box-shadow:none}.tools button.on{background:linear-gradient(90deg,var(--lime),var(--cyan));color:#0B1410}
  .sliders{display:flex;gap:10px;margin:0 0 10px}.sliders label{flex:1;display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--ink-soft)}.sliders input{flex:1;accent-color:var(--lime)}.sliders b{color:var(--gold);min-width:44px;text-align:right}
  .actions + .actions{margin-top:8px}
  .back{background:none;color:var(--ink-soft);flex:0;align-self:flex-start;width:auto;padding:4px 0 8px;font-weight:800;font-size:14px;box-shadow:none}
</style>
</head>
<body>
<div class="app">
  <section class="screen on" id="home">
    <div class="hero">
      <div class="wordmark">Green<em>.</em>Read</div>
      <div class="tag">Read the green. Drop the ball. Watch it break.</div>
    </div>
    <div class="menu">
      <button id="goDaily"><span>Today's green<small id="dailySub">One green, three balls, everyone plays the same one</small></span><span class="n" id="dailyNum"></span></button>
      <button class="quiet" id="goPlay"><span>Play<small id="playSub">Endless greens, each a little harder</small></span><span class="n" id="playNum"></span></button>
      <button class="quiet" id="goCreate"><span>Create a green<small>Shape it, test it, send it to a friend</small></span><span class="n">✎</span></button>
    </div>
  </section>

  <section class="screen" id="create">
    <button class="back" id="backC">← Home</button>
    <header><div class="green-name">Your green<small id="csub">Tap the green to place things</small></div><div class="target">verdict<b id="verdict">—</b></div></header>
    <div class="tools" id="tools">
      <button data-t="mound" class="on">Mound</button><button data-t="dip">Dip</button><button data-t="cup">Cup</button><button data-t="zone">Zone</button><button id="undo">Undo</button>
    </div>
    <div class="sliders">
      <label>Tier drop <input type="range" id="drop" min="1.2" max="2.8" step="0.1" value="1.8"><b id="dropV">1.8 ft</b></label>
      <label>Speed <input type="range" id="stimpS" min="9" max="14" step="0.5" value="11"><b id="stimpV">11</b></label>
    </div>
    <div class="stage-slot" id="slotC"></div>
    <div class="msg" id="cmsg">Mounds push the ball away, dips pull it in. Place a few, move the cup and the drop zone, then check it.</div>
    <div class="actions"><button id="check" class="quiet">Check it</button><button id="playIt">Play it</button></div>
    <div class="actions"><button id="reshape" class="quiet">New shape</button><button id="copyCode" class="quiet">Copy code</button><button id="loadCode" class="quiet">Load code</button></div>
  </section>

  <section class="screen" id="play">
    <button class="back" id="back">← Home</button>
    <header>
      <div class="green-name" id="name">—<small id="sub"></small></div>
      <div class="target">to pass<b id="target">—</b></div>
    </header>
    <div class="status"><div class="balls" id="balls"></div><div class="best">best <b id="best">0</b> <span id="stars" class="stars"></span></div></div>
    <div class="goals" id="goals"></div>
    <div class="stage-slot" id="slotP"><div class="stage" id="stage"><canvas id="c"></canvas><div class="loading hidden" id="loading">Reading the green…</div></div></div>
    <div class="msg" id="msg"></div>
    <div class="share hidden" id="share"></div>
    <div class="actions">
      <button id="next" class="hidden">Next green</button>
      <button id="retry" class="quiet hidden">Try again</button>
      <button id="shareBtn" class="hidden">Share result</button>
    </div>
    <div class="foot"><span>Closer = more pts</span><span id="stimp"></span></div>
  </section>
</div>

<script>
const P = { simulate, score, inside };
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const $ = id => document.getElementById(id);
const BALLS = 3, FOG_R = 3.2, EPOCH = new Date(2026, 8, 12), G = 32.2;

$('goDaily').onclick = () => start('daily'); $('goPlay').onclick = () => start('play'); $('goCreate').onclick = () => openEditor();
$('back').onclick = () => { roll = null; celebrateT = 0; if (mode === 'custom') openEditor(ed); else show('home'); };

  $('name').firstChild.textContent = m === 'daily' ? `Daily #${dailyN}` : `Green ${levelNo}`; $('sub').textContent = ''; $('msg').textContent = '';
  setTimeout(() => { const g = m === 'daily' ? generate(hashStr('daily-' + dayKey(today)), 0.35, P) : generate(7000 + levelNo, Math.min(1, (levelNo - 1) / 40), P);
    setup(g.level); $('loading').classList.add('hidden'); }, 30); }
function setup(level) {
  L = level; balls = BALLS; best = 0; trails = []; ball = null; revealPts = []; particles = []; flagShake = 0; celebrateT = 0; results = [];
  $('name').firstChild.textContent = L.name; $('sub').textContent = mode === 'daily' ? `Daily #${dailyN} · ${today.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}` : mode === 'custom' ? 'Custom green' : `Green ${levelNo}`;
  L.t1 = L.target; L.t2 = Math.min(80, L.target + 18); $('target').textContent = L.t1; $('stimp').textContent = `Stimp ${L.stimp}`;
  $('goals').innerHTML = `<span><b>★</b>${L.t1} pts</span><span><b>★★</b>${L.t2} pts</span><span><b>★★★</b>Hole it</span>`; renderStars();

  if (mode === 'daily') { $('goals').innerHTML = `<span><b>TODAY</b>All 3 balls count · max 300</span>`; $('target').textContent = '300'; document.querySelector('#play .target').firstChild.textContent = 'max today'; }
  else document.querySelector('#play .target').firstChild.textContent = 'to pass';
  say(mode === 'daily' ? `One shot at today's green: three balls, all three count, ${mode === 'daily' ? 'up to 300' : ''}. Closer = more points, in the cup = 100. Press and drag to aim, let go to drop.` : `Closer to the cup = more points, up to 80. In the cup = 100. Best of ${BALLS} balls counts. Press and drag inside the zone to aim, let go to drop.`);
  cam = { z: 1, cx: level.W / 2, cy: level.H / 2 }; renderBalls(); layout(); if (!anim) anim = requestAnimationFrame(loop);
}
function say(text, result) { $('msg').innerHTML = (result ? `<div class="result">${result}</div>` : '') + `<div>${text}</div>`; }
function starsFor(s) { return s >= 100 ? 3 : s >= L.t2 ? 2 : s >= L.t1 ? 1 : 0; }
function renderStars() { const n = starsFor(best); $('stars').innerHTML = [0,1,2].map(i => `<span class="${i < n ? '' : 'off'}">★</span>`).join(''); [...$('goals').children].forEach((el, i) => el.classList.toggle('hit', i < n)); }

function layout() { dpr = Math.min(2, window.devicePixelRatio || 1); const w = cv.clientWidth; scale = w / L.W;
  cv.width = Math.round(w * dpr); cv.height = Math.round(L.H * scale * dpr); cv.style.height = (L.H * scale) + 'px'; buildShade(); draw(); }

const THR = () => 18 / L.stimp / G;   // slope at which a resting ball starts to roll
let flow = [], cam = { z: 1, cx: 0, cy: 0 }, lastTs = null, anim = null, fogC = null, scene = null, cheer = 0;
function buildShade() { const cell = 3, cw = Math.ceil(cv.width / cell), ch = Math.ceil(cv.height / cell);
  shade = document.createElement('canvas'); shade.width = cw; shade.height = ch; const sctx = shade.getContext('2d'), img = sctx.createImageData(cw, ch), d = img.data;

  return (hash2(i, j) * (1-u) + hash2(i+1, j) * u) * (1-v) + (hash2(i, j+1) * (1-u) + hash2(i+1, j+1) * u) * v; }
function buildScene() { const r = rng((L.seed || 1) + 99); scene = { trees: [], bunkers: [], crowd: [] };
  const S = L.shape; if (!S) return;
  const dist = (x, y) => { const dx = (x - S.cx) / S.rx, dy = (y - S.cy) / S.ry; return Math.hypot(dx, dy) / shapeR(S, Math.atan2(dy, dx)); };   // 1 = edge of green

    if (on(x, y) && dist(x, y) > 1.14 + s * 0.045 && !scene.trees.some(q => Math.hypot(q.x - x, q.y - y) < (q.s + s) * 0.7)) scene.trees.push({ x, y, s, k: r(), lobes: Array.from({ length: 7 }, () => [r() * 6.28, 0.35 + r() * 0.4, 0.45 + r() * 0.3]) }); }

    const x = S.cx + Math.cos(th) * rr * S.rx, y = S.cy + Math.sin(th) * rr * S.ry; if (!on(x, y) || y > L.H - 1.2) continue;

  for (const p of scene.crowd) { const x = px(p.x), h = px(2.3); const hop = cheer > 0 ? Math.abs(Math.sin(t * 9 + p.ph)) * h * 0.22 * cheer : 0; const y = px(p.y) - hop, f = p.face;
    ctx.fillStyle = 'rgba(0,0,0,0.38)'; ctx.beginPath(); ctx.ellipse(x + h*0.05, px(p.y) + h*0.02, h*0.3, h*0.11, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#2B2F3A'; roundRect(x - h*0.2, y - h*0.5, h*0.17, h*0.5, h*0.06); ctx.fill(); roundRect(x + h*0.03, y - h*0.5, h*0.17, h*0.5, h*0.06); ctx.fill();             // legs
    const sh = ctx.createLinearGradient(x - h*0.3, 0, x + h*0.3, 0); sh.addColorStop(0, p.c); sh.addColorStop(1, shade2(p.c, 0.7)); ctx.fillStyle = sh; roundRect(x - h*0.3, y - h*0.98, h*0.6, h*0.55, h*0.14); ctx.fill();   // shirt

  show('create'); L = assemble(); cam = { z: 1, cx: 15, cy: 22 }; layout(); if (!anim) anim = requestAnimationFrame(loop); }
function edRefresh() { L = assemble(); buildShade(); $('verdict').textContent = '—'; }
$('backC').onclick = () => { editing = false; show('home'); };
$('tools').addEventListener('click', e => { const b = e.target.closest('button'); if (!b || !b.dataset.t) return; tool = b.dataset.t; [...$('tools').children].forEach(x => x.classList.toggle('on', x === b));
  $('csub').textContent = { mound: 'Tap to add a mound (pushes the ball away). Tap one to remove it.', dip: 'Tap to add a dip (pulls the ball in). Tap one to remove it.', cup: 'Tap where the cup goes', zone: 'Tap where the drop zone goes' }[tool]; });
$('drop').onpointerdown = () => snap(); $('stimpS').onpointerdown = () => snap();
$('drop').oninput = e => { ed.drop = +e.target.value; $('dropV').textContent = ed.drop.toFixed(1) + ' ft'; edRefresh(); };
$('stimpS').oninput = e => { ed.stimp = +e.target.value; $('stimpV').textContent = ed.stimp; edRefresh(); };
$('reshape').onclick = () => { snap(); ed.seed = edSeed(); edRefresh(); };
let edHist = [];
function snap() { edHist.push(JSON.stringify(ed)); if (edHist.length > 30) edHist.shift(); }
$('undo').onclick = () => { if (!edHist.length) { $('cmsg').textContent = 'Nothing to undo.'; return; } ed = JSON.parse(edHist.pop()); $('drop').value = ed.drop; $('stimpS').value = ed.stimp; $('dropV').textContent = ed.drop.toFixed(1) + ' ft'; $('stimpV').textContent = ed.stimp; $('cmsg').textContent = 'Undone.'; edRefresh(); };
function edTap(x, y) { if (!inside(L, x, y)) { $('cmsg').textContent = 'That is off the green.'; return; }
  // tapping an existing mound or dip removes it, whatever tool is selected
  let hit = -1, hd = 2.2; ed.f.forEach((f, i) => { const d = Math.hypot(f.x - x, f.y - y); if (d < hd) { hd = d; hit = i; } });
  if (hit >= 0 && tool !== 'cup' && tool !== 'zone') { snap(); ed.f.splice(hit, 1); $('cmsg').textContent = 'Removed.'; edRefresh(); return; }
  snap();
  if (tool === 'mound' || tool === 'dip') { if (ed.f.length >= 6) { $('cmsg').textContent = 'Six is plenty — erase one first.'; return; } ed.f.push({ x: +x.toFixed(1), y: +y.toFixed(1), a: tool === 'mound' ? 0.9 : -0.9, s: 4.5 }); }
  else if (tool === 'cup') { if (y < 20) { $('cmsg').textContent = 'Keep the cup on the lower half so the ball can reach it.'; return; } ed.hole = { x: +x.toFixed(1), y: +y.toFixed(1) }; }
  else if (tool === 'zone') { const z = ed.zone, nx = Math.max(2, Math.min(28 - z.w, +(x - z.w/2).toFixed(1))), ny = Math.max(3, Math.min(14, +(y - z.h/2).toFixed(1)));
    const fits = [[nx, ny], [nx + z.w, ny], [nx, ny + z.h], [nx + z.w, ny + z.h]].every(q => inside(L, q[0], q[1])); if (!fits) { $('cmsg').textContent = 'The zone has to sit fully on the green — try nearer the middle.'; return; } z.x = nx; z.y = ny; }
  $('cmsg').textContent = 'Changed. Check it when you are ready.'; edRefresh(); }
function runCheck() { const z = ed.zone; if (![[z.x, z.y], [z.x + z.w, z.y], [z.x, z.y + z.h], [z.x + z.w, z.y + z.h]].every(q => inside(L, q[0], q[1]))) { $('verdict').textContent = 'Zone off'; $('cmsg').textContent = 'Part of the drop zone is off the green. Move it, or pick a new shape.'; return false; } const st = solve(L, P, 55, 1); const v = st.moved < 95 ? 'Dead spots' : st.pass < 1 ? 'Impossible' : st.pass < 3 ? 'Brutal' : st.pass > 45 ? 'Too easy' : st.holed < 1 ? 'No hole-outs' : st.lip > 5 ? 'Runs hot' : 'Fair'; $('verdict').textContent = v;
  $('cmsg').textContent = `From the zone: ${st.holed.toFixed(0)}% of drops hole out, ${st.pass.toFixed(0)}% score 55+, ${st.lip.toFixed(0)}% run over the cup.` + (st.moved < 95 ? ' Some balls will not move — raise the tier drop or move the zone.' : st.holed < 1 && st.pass >= 3 ? ' Nothing holes out yet — nudge the cup or add a dip near it.' : ''); return !['Dead spots', 'Impossible'].includes(v); }
$('check').onclick = runCheck;
$('playIt').onclick = () => { if (!runCheck()) { $('cmsg').textContent += ' Fix that before playing.'; return; } editing = false; mode = 'custom'; show('play'); setup(assemble()); };
function edCode() { return btoa(unescape(encodeURIComponent(JSON.stringify(ed)))); }
$('copyCode').onclick = async () => { if (!runCheck()) { $('cmsg').textContent += ' Fix that before sharing.'; return; } const code = 'GR1.' + edCode(); try { if (navigator.share) await navigator.share({ text: `Beat my green in Green Read: ${code}` }); else { await navigator.clipboard.writeText(code); $('copyCode').textContent = 'Copied'; } } catch (e) {} };
$('loadCode').onclick = () => { const c = prompt('Paste a green code'); if (!c) return; try { const j = JSON.parse(decodeURIComponent(escape(atob(c.trim().replace(/^GR1\./, ''))))); openEditor(j); } catch (e) { $('cmsg').textContent = 'That code did not work.'; } };
function toGreen(e) { const rect = cv.getBoundingClientRect(); return [(e.clientX - rect.left) / rect.width * L.W, (e.clientY - rect.top) / rect.height * L.H]; }
function clampZone(x, y) { const z = L.zone; return [Math.max(z.x + .2, Math.min(z.x + z.w - .2, x)), Math.max(z.y + .2, Math.min(z.y + z.h - .2, y))]; }
cv.addEventListener('pointerdown', e => { if (editing) { const [x, y] = toGreen(e); edTap(x, y); return; } if (balls <= 0 || roll || celebrateT > 0 || !L) return; const [x, y] = toGreen(e);
  if (!inZone(x, y)) { say('Start inside the drop zone, then drag to aim.'); flashZone(); return; } cv.setPointerCapture(e.pointerId); aim = clampZone(x, y); });
cv.addEventListener('pointermove', e => { if (!aim) return; aim = clampZone(...toGreen(e)); });
cv.addEventListener('pointerup', e => { if (!aim) return; const [x, y] = aim; aim = null; drop(x, y); });
cv.addEventListener('pointercancel', () => { aim = null; });
$('next').onclick = () => { levelNo++; $('playNum').textContent = levelNo > 1 ? '#' + levelNo : ''; start('play'); };
$('retry').onclick = () => mode === 'custom' ? setup(assemble()) : start('play');
$('shareBtn').onclick = async () => { const text = shareText(); try { if (navigator.share) await navigator.share({ text }); else { await navigator.clipboard.writeText(text); $('shareBtn').textContent = 'Copied'; } } catch (e) {} };
window.addEventListener('resize', () => { if (L) layout(); });
</script>

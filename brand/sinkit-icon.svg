<?xml version="1.0" encoding="UTF-8"?>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="bg" cx="35%" cy="26%" r="90%">
      <stop offset="0%" stop-color="#1F5A34"/>
      <stop offset="55%" stop-color="#12341F"/>
      <stop offset="100%" stop-color="#081712"/>
    </radialGradient>
    <linearGradient id="ballShade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#D8DDD6"/>
    </linearGradient>
    <radialGradient id="cupDepth" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#233B2A"/>
      <stop offset="70%" stop-color="#0A130D"/>
      <stop offset="100%" stop-color="#000000"/>
    </radialGradient>
    <linearGradient id="flagGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A63"/>
      <stop offset="100%" stop-color="#FF5A5F"/>
    </linearGradient>
    <linearGradient id="dotGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8F53D"/>
      <stop offset="100%" stop-color="#4CE0D2"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g opacity="0.05">
    <rect x="0" y="60" width="1024" height="70" fill="#FFFFFF"/>
    <rect x="0" y="220" width="1024" height="70" fill="#FFFFFF"/>
    <rect x="0" y="380" width="1024" height="70" fill="#FFFFFF"/>
    <rect x="0" y="540" width="1024" height="70" fill="#FFFFFF"/>
    <rect x="0" y="700" width="1024" height="70" fill="#FFFFFF"/>
    <rect x="0" y="860" width="1024" height="70" fill="#FFFFFF"/>
  </g>

  <!-- comet trail: the ball's read break, hand-placed, tapering toward the cup -->
  <g fill="url(#dotGrad)">
    <circle cx="269" cy="485" r="19"/>
    <circle cx="251" cy="535" r="17"/>
    <circle cx="259" cy="579" r="15"/>
    <circle cx="295" cy="616" r="13"/>
    <circle cx="353" cy="641" r="11"/>
    <circle cx="423" cy="656" r="9"/>
  </g>
  <g transform="translate(465,660) rotate(18)">
    <path d="M 0 -22 L 30 0 L 0 22 Z" fill="#4CE0D2"/>
  </g>

  <!-- cup -->
  <ellipse cx="620" cy="672" rx="132" ry="112" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="620" cy="672" rx="112" ry="94" fill="url(#cupDepth)"/>

  <!-- flagstick -->
  <rect x="612" y="330" width="16" height="345" rx="6" fill="#F2EBDD"/>
  <path d="M 628 340 L 628 460 L 800 410 L 628 340" fill="url(#flagGrad)"/>

  <!-- golf ball -->
  <g transform="translate(300,330)">
    <ellipse cx="14" cy="118" rx="96" ry="26" fill="#000000" opacity="0.35"/>
    <circle cx="0" cy="0" r="112" fill="url(#ballShade)"/>
    <circle cx="-34" cy="-34" r="46" fill="#FFFFFF" opacity="0.55"/>
    <g fill="#B9C0BA" opacity="0.85">
      <circle cx="-40" cy="-6" r="9"/><circle cx="-8" cy="-30" r="9"/><circle cx="26" cy="-14" r="9"/>
      <circle cx="-52" cy="26" r="9"/><circle cx="-16" cy="16" r="9"/><circle cx="20" cy="34" r="9"/>
      <circle cx="46" cy="4" r="9"/><circle cx="-2" cy="50" r="9"/><circle cx="48" cy="44" r="9"/>
      <circle cx="-46" cy="58" r="9"/><circle cx="10" cy="-58" r="9"/><circle cx="52" cy="-30" r="9"/>
    </g>
    <circle cx="0" cy="0" r="112" fill="none" stroke="#00000022" stroke-width="3"/>
  </g>
</svg>
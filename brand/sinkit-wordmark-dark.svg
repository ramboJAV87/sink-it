<?xml version="1.0" encoding="UTF-8"?>
<svg width="1400" height="420" viewBox="0 0 1400 420" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="wbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1912"/><stop offset="100%" stop-color="#081410"/>
    </linearGradient>
    <linearGradient id="wflag" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF7A63"/><stop offset="100%" stop-color="#FF5A5F"/>
    </linearGradient>
    <radialGradient id="wcup" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#233B2A"/><stop offset="70%" stop-color="#0A130D"/><stop offset="100%" stop-color="#000"/>
    </radialGradient>
    <linearGradient id="wdot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B8F53D"/><stop offset="100%" stop-color="#4CE0D2"/>
    </linearGradient>
    <linearGradient id="wballshade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#D8DDD6"/>
    </linearGradient>
  </defs>
  <rect width="1400" height="420" fill="url(#wbg)"/>

  <!-- comet trail -->
  <g fill="url(#wdot)">
    <circle cx="121.6" cy="220.4" r="10.5"/><circle cx="110.0" cy="253.0" r="9.3"/><circle cx="114.2" cy="278.8" r="8.1"/>
    <circle cx="135.5" cy="296.7" r="6.9"/><circle cx="172.2" cy="305.3" r="5.7"/><circle cx="217.8" cy="305.8" r="4.6"/>
  </g>
  <g transform="translate(258,304) rotate(8)"><path d="M 0 -12 L 16 0 L 0 12 Z" fill="#4CE0D2"/></g>

  <!-- cup -->
  <ellipse cx="340" cy="300" rx="72" ry="60" fill="#FFFFFF" opacity="0.9"/>
  <ellipse cx="340" cy="300" rx="60" ry="50" fill="url(#wcup)"/>

  <!-- flagstick + flag -->
  <rect x="333" y="96" width="9" height="204" rx="4" fill="#F2EBDD"/>
  <path d="M 342 102 L 342 168 L 430 141 Z" fill="url(#wflag)"/>

  <!-- ball -->
  <g transform="translate(140,132)">
    <ellipse cx="8" cy="62" rx="50" ry="13" fill="#000000" opacity="0.32"/>
    <circle cx="0" cy="0" r="58" fill="url(#wballshade)"/>
    <circle cx="-18" cy="-18" r="24" fill="#FFFFFF" opacity="0.55"/>
    <g fill="#B9C0BA" opacity="0.85">
      <circle cx="-20" cy="-3" r="4.7"/><circle cx="-4" cy="-15" r="4.7"/><circle cx="13" cy="-7" r="4.7"/>
      <circle cx="-26" cy="13" r="4.7"/><circle cx="-8" cy="8" r="4.7"/><circle cx="10" cy="17" r="4.7"/>
      <circle cx="23" cy="2" r="4.7"/><circle cx="-1" cy="25" r="4.7"/><circle cx="24" cy="22" r="4.7"/>
    </g>
  </g>

  <text x="450" y="270" font-family="Poppins" font-weight="700" font-size="164" fill="#FFFFFF" letter-spacing="-2">sink</text>
  <text x="820" y="270" font-family="Poppins" font-weight="700" font-size="164" fill="#B8F53D" letter-spacing="-2">it</text>
</svg>